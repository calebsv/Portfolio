<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleb Lira — Portfólio</title>
<link rel="icon" type="image/png" href="assets/img/favicon.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#05070B;
    --bg-2:#0C1220;
    --text:#EDEDF2;
    --muted:#6E7688;
    --line:rgba(237,237,242,0.08);
    --primary:#0f172a;
    --secondary:#10b981;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    background:
      radial-gradient(1100px 700px at 78% 20%, var(--primary), transparent 60%),
      radial-gradient(900px 600px at 15% 85%, rgba(23,40,70,0.35), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 70%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:1;
  }

  main{
    position:relative;
    z-index:5;
    min-height:calc(100vh - 60px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:56px;
    padding:40px 8vw;
    flex-wrap:wrap;
  }

  @keyframes fadeInLeft{
    from{ opacity:0; transform:translateX(-40px); }
    to{ opacity:1; transform:translateX(0); }
  }

  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .portrait{
    position:relative;
    width:220px;
    height:280px;
    flex:0 0 auto;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 15% 100%);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    opacity:0;
    animation:fadeInLeft .8s ease-out forwards;
    animation-delay:0.1s;
  }
  .portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    mix-blend-mode:luminosity;
    opacity:0.95;
  }
  .portrait::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.35), transparent 55%);
  }

  .title-block{
    flex:1 1 420px;
    max-width:560px;
    opacity:0;
    animation:fadeInUp .8s ease-out forwards;
    animation-delay:0.5s;
  }

  .title-row{
    display:flex;
    align-items:baseline;
    gap:18px;
    flex-wrap:wrap;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(3.2rem, 8vw, 6.4rem);
    letter-spacing:0.02em;
    line-height:0.9;
    color:var(--secondary);
  }

  .year{
    font-family:'JetBrains Mono', monospace;
    font-size:1.15rem;
    color:var(--secondary);
    letter-spacing:0.05em;
  }

  .subtitle{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 46px;
    font-family:'Sora', monospace;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--secondary);
  }
  .subtitle .sq{
    width:8px; height:8px;
    background:var(--secondary);
  }

  .menu{
    display:flex;
    flex-direction:column;
    gap:4px;
    opacity:0;
    animation:fadeInUp .8s ease-out forwards;
    animation-delay:0.9s;
  }

  .menu-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 4px;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    letter-spacing:0.12em;
    color:var(--secondary);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    max-width:340px;
    transition:color .2s ease, padding-left .2s ease;
  }

  .menu-item .marker{
    width:0px;
    height:2px;
    background:var(--secondary);
    transition:width .2s ease;
  }

  .menu-item:hover,
  .menu-item:focus-visible{
    color:var(--text);
    padding-left:14px;
  }
  .menu-item:hover .marker,
  .menu-item:focus-visible .marker{
    width:22px;
  }

  .menu-item.primary{ color:var(--text); }
  .menu-item.primary .marker{ width:22px; background:var(--secondary); }
  .menu-item.primary:hover{ color:var(--secondary); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .portrait,
    .title-block,
    .menu{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }

  @media (max-width:720px){
    main{ flex-direction:column; text-align:center; gap:34px; }
    .title-row{ justify-content:center; }
    .subtitle{ justify-content:center; }
    .menu-item{ margin:0 auto; }
  }
</style>
</head>
<body>

  <main>
    <div class="portrait">
      <img src="assets/img/perfil-home.jpg" alt="Foto de Caleb Lira">
    </div>

    <div class="title-block">
      <div class="title-row">
        <h1>Portfólio</h1>
        <span class="year">2026</span>
      </div>
      <div class="subtitle">
        <span class="sq"></span>
        DESENVOLVEDOR
      </div>

      <nav class="menu">
        <a class="menu-item primary" href="portfolio.html">
          <span class="marker"></span> VER PORTFÓLIO
        </a>
      </nav>
    </div>
  </main>


</body>
</html>
