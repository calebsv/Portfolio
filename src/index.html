<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleb Lira | Portfolio</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&family=Sora:wght@500;600;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#05070B;
    --bg-2:#0C1220;
    --text:#EDEDF2;
    --muted:#6E7688;
    --line:rgba(237,237,242,0.08);
    --primary:#0f172a;
    --secondary:#10b981;
    --ease-premium:cubic-bezier(.76,0,.24,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; scroll-behavior:smooth; }

  body{
    background:
      radial-gradient(1100px 700px at 78% 20%, var(--primary), transparent 60%),
      radial-gradient(900px 600px at 15% 85%, rgba(23,40,70,0.35), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 70%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
  }

  body:not(.loaded){ overflow:hidden; }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:1;
  }

  #preloader{
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:all;
    visibility:visible;
  }

  .pl-curtain{
    position:absolute;
    inset:0;
    background:var(--bg-1);
    will-change:transform;
    transition:transform 1.3s var(--ease-premium);
  }
  .pl-curtain::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(700px 500px at 50% 45%, rgba(16,185,129,0.07), transparent 70%);
  }
  .pl-curve{
    position:absolute;
    left:-10vw;
    right:-10vw;
    top:calc(100% - 1px);
    height:12vh;
    background:var(--bg-1);
    border-radius:0 0 50% 50% / 0 0 100% 100%;
    transition:height 1.3s var(--ease-premium);
  }

  .pl-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    transition:opacity .6s ease, transform .9s var(--ease-premium);
  }

  .pl-name{
    display:flex;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(1.6rem, 4.2vw, 2.6rem);
    letter-spacing:0.42em;
    padding-left:0.42em; /* compensa o letter-spacing para centralizar */
    color:var(--text);
  }
  .pl-name .mask{
    display:inline-block;
    overflow:hidden;
    line-height:1.3;
  }
  .pl-name .char{
    display:inline-block;
    transform:translateY(110%);
    opacity:0;
    transition:transform 1.1s var(--ease-out), opacity .9s ease;
  }
  #preloader.in .pl-name .char{
    transform:translateY(0);
    opacity:1;
  }

  /* Linha de progresso fina */
  .pl-line{
    width:min(240px, 52vw);
    height:1px;
    background:var(--line);
    overflow:hidden;
    opacity:0;
    transition:opacity .8s ease .5s;
  }
  #preloader.in .pl-line{ opacity:1; }
  .pl-line-fill{
    width:100%;
    height:100%;
    background:var(--secondary);
    box-shadow:0 0 12px rgba(16,185,129,0.8);
    transform:scaleX(0);
    transform-origin:left center;
    will-change:transform;
  }

  /* Rodapé: contador e legenda */
  .pl-foot{
    position:absolute;
    left:clamp(24px, 5vw, 56px);
    right:clamp(24px, 5vw, 56px);
    bottom:clamp(24px, 5vh, 48px);
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    color:var(--muted);
    font-size:12px;
    letter-spacing:0.14em;
    opacity:0;
    transition:opacity .8s ease .4s;
  }
  #preloader.in .pl-foot{ opacity:1; }
  .pl-count{
    font-family:'Space Grotesk', sans-serif;
    font-weight:300;
    font-size:clamp(3rem, 9vw, 6rem);
    line-height:.85;
    letter-spacing:-0.02em;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .pl-count small{
    font-size:.3em;
    margin-left:.25em;
    color:var(--secondary);
    letter-spacing:0;
  }

  /* Saída: conteúdo some, cortina sobe */
  #preloader.out .pl-content,
  #preloader.out .pl-foot{
    opacity:0;
    transform:translateY(-14px);
    transition:opacity .5s ease, transform .9s var(--ease-premium);
  }
  #preloader.lift .pl-curtain{ transform:translateY(-100%); }
  #preloader.lift .pl-curve{ height:0; }
  #preloader.done{ visibility:hidden; pointer-events:none; }

  /* ========== PÁGINA ========== */
  main{
    position:relative;
    z-index:5;
    min-height:calc(100vh - 60px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:56px;
    padding:40px 8vw;
    flex-wrap:wrap;
  }

  @keyframes fadeInLeft{
    from{ opacity:0; transform:translateX(-40px); }
    to{ opacity:1; transform:translateX(0); }
  }

  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .portrait{
    position:relative;
    width:220px;
    height:280px;
    flex:0 0 auto;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 15% 100%);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    opacity:0;
    border:var(--secondary) 5px solid;
    border-radius:4px;
  }

  body.loaded .portrait{
    animation:fadeInLeft 1.2s var(--ease-out) forwards;
    animation-delay:0.35s;
  }
  .portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    mix-blend-mode:luminosity;
    opacity:0.95;
  }
  .portrait::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.35), transparent 55%);
  }

  .title-block{
    flex:1 1 420px;
    max-width:560px;
    opacity:0;
  }

  body.loaded .title-block{
    animation:fadeInUp 1.2s var(--ease-out) forwards;
    animation-delay:0.6s;
  }

  .title-row{
    display:flex;
    align-items:baseline;
    gap:18px;
    flex-wrap:wrap;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(3rem, 8vw, 6rem);
    letter-spacing:0.02em;
    line-height:0.9;
    color:var(--secondary);
     text-shadow:
    0 0 8px  rgba(16,185,129,0.55),
    0 0 24px rgba(16,185,129,0.35),
    0 0 48px rgba(16,185,129,0.20);
  }
  

  .year{
    font-family:'JetBrains Mono', monospace;
    font-size:1.15rem;
    color:var(--secondary);
    letter-spacing:0.05em;
  }

  .subtitle{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 46px;
    font-family:'Sora', monospace;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--secondary);
  }
  .subtitle .sq{
    width:8px; height:8px;
    background:var(--secondary);
  }

  .menu{
    display:flex;
    flex-direction:column;
    gap:4px;
    opacity:0;
  }

  body.loaded .menu{
    animation:fadeInUp 1.2s var(--ease-out) forwards;
    animation-delay:0.85s;
  }

  .menu-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 4px;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    letter-spacing:0.12em;
    color:var(--secondary);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    max-width:340px;
    transition:color .2s ease, padding-left .2s ease;
  }

  .menu-item .marker{
    width:0px;
    height:2px;
    background:var(--secondary);
    transition:width .2s ease;
  }

  .menu-item:hover,
  .menu-item:focus-visible{
    color:var(--text);
    padding-left:14px;
  }
  .menu-item:hover .marker,
  .menu-item:focus-visible .marker{
    width:22px;
  }

  .menu-item.primary{ color:var(--text); }
  .menu-item.primary .marker{ width:22px; background:var(--secondary); }
  .menu-item.primary:hover{ color:var(--secondary); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .portrait,
    .title-block,
    .menu,
    body.loaded .portrait,
    body.loaded .title-block,
    body.loaded .menu{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
    #preloader .pl-curtain{ transition:opacity .4s ease !important; }
    #preloader.lift .pl-curtain{ transform:none; opacity:0; }
  }

  @media (max-width:720px){
    main{ flex-direction:column; text-align:center; gap:34px; }
    .title-row{ justify-content:center; }
    .subtitle{ justify-content:center; }
    .menu-item{ margin:0 auto; }
    .pl-foot span:last-child{ display:none; }
  }
</style>
</head>
<!--PORTFOLIO BY CALEBÃO-->
<body>

  <div id="preloader" aria-hidden="true">
    <div class="pl-curtain"></div>
    <div class="pl-curve"></div>

    <div class="pl-content">
      <div class="pl-name" id="pl-name"></div>
      <div class="pl-line"><div class="pl-line-fill" id="pl-fill"></div></div>
    </div>

    <div class="pl-foot">
      <div class="pl-count"><span id="pl-number">0</span><small>%</small></div>
      <span>FRONT-END DEVELOPER</span>
    </div>
  </div>

  <main>
    <div class="portrait">
      <img src="assets/img/perfil-home.jpg" alt="Foto de Caleb Lira">
    </div>

    <div class="title-block">
      <div class="title-row">
        <h1>Caleb Lira</h1>
        <span class="year">2026</span>
      </div>
      <div class="subtitle">
        <span class="sq"></span>
        FRONT-END DEVELOPER
      </div>

      <nav class="menu">
        <a class="menu-item primary" href="portfolio.html">
          <span class="marker"></span> VIEW PORTFOLIO
        </a>
      </nav>
    </div>
  </main>

  <script>
    (function () {
      const preloader = document.getElementById('preloader');
      const nameEl    = document.getElementById('pl-name');
      const fillEl    = document.getElementById('pl-fill');
      const numberEl  = document.getElementById('pl-number');

      const NAME     = 'CALEB LIRA';
      const DURATION = 2800;   // tempo do contador (ms)
      const reduced  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      [...NAME].forEach((ch, i) => {
        const mask = document.createElement('span');
        mask.className = 'mask';
        const c = document.createElement('span');
        c.className = 'char';
        c.innerHTML = ch === ' ' ? '&nbsp;' : ch;
        c.style.transitionDelay = (0.15 + i * 0.07) + 's';
        mask.appendChild(c);
        nameEl.appendChild(mask);
      });

      const ease = t => t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;

      let finished = false;

      function finish() {
        if (finished) return;
        finished = true;
        setTimeout(() => preloader.classList.add('out'), 250);
        setTimeout(() => {
          preloader.classList.add('lift');
          setTimeout(() => document.body.classList.add('loaded'), 450);
        }, 650);
        setTimeout(() => preloader.classList.add('done'), 650 + 1400);
      }

      function run() {
        preloader.classList.add('in');
        if (reduced) {
          fillEl.style.transform = 'scaleX(1)';
          numberEl.textContent = '100';
          setTimeout(finish, 400);
          return;
        }
        let start = null;
        function step(ts) {
          if (!start) start = ts;
          const p = Math.min((ts - start) / DURATION, 1);
          const e = ease(p);
          fillEl.style.transform = 'scaleX(' + e + ')';
          numberEl.textContent = Math.round(e * 100);
          if (p < 1) requestAnimationFrame(step);
          else finish();
        }
        requestAnimationFrame(step);
      }

      window.addEventListener('load', () => requestAnimationFrame(run));

      setTimeout(() => { if (!finished) { run(); } }, 8000);
    })();
  </script>

</body>
</html>
