<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleb Lira | Portfólio</title>
<link rel="icon" type="image/png" href="/src/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#05070B;
    --bg-2:#0C1220;
    --text:#EDEDF2;
    --muted:#6E7688;
    --line:rgba(237,237,242,0.08);
    --primary:#0f172a;
    --secondary:#10b981;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; 
  scroll-behavior: smooth;}

  body{
    background:
      radial-gradient(1100px 700px at 78% 20%, var(--primary), transparent 60%),
      radial-gradient(900px 600px at 15% 85%, rgba(23,40,70,0.35), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 70%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
      user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:1;
  }

  #preloader{
    position:fixed;
    inset:0;
    z-index:100;
    background:linear-gradient(160deg, var(--bg-1), var(--bg-2) 70%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    transition:opacity .6s ease, visibility .6s ease;
  }

  #preloader.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  #preloader::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(16,185,129,0.025) 0px,
      rgba(16,185,129,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  .hud-frame{
    position:relative;
    padding:26px 30px;
  }

  .hud-corner{
    position:absolute;
    width:16px;
    height:16px;
    border:2px solid var(--secondary);
  }
  .hud-corner.tl{ top:0; left:0; border-right:none; border-bottom:none; }
  .hud-corner.tr{ top:0; right:0; border-left:none; border-bottom:none; }
  .hud-corner.bl{ bottom:0; left:0; border-right:none; border-top:none; }
  .hud-corner.br{ bottom:0; right:0; border-left:none; border-top:none; }

  .block-row{
    display:flex;
    gap:4px;
  }

  .block-row .block{
    width:9px;
    height:22px;
    background:rgba(237,237,242,0.06);
    border:1px solid var(--line);
    transition:background .15s ease, box-shadow .15s ease, border-color .15s ease;
  }

  .block-row .block.active{
    background:var(--secondary);
    border-color:var(--secondary);
    box-shadow:0 0 10px rgba(16,185,129,0.65), 0 0 2px rgba(16,185,129,0.9);
  }

  .loader-readout{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:clamp(2rem, 5vw, 2.8rem);
    color:var(--text);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.06em;
    text-align:center;
  }

  .loader-readout .bracket{
    color:var(--muted);
  }

  #loader-number{
    color:var(--secondary);
    text-shadow:0 0 12px rgba(16,185,129,0.5);
  }

  .loader-label{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:10px;
  }

  .loader-label .sq{
    width:8px;
    height:8px;
    background:var(--secondary);
    animation:blink 1s steps(2) infinite;
  }

  @keyframes blink{
    50%{ opacity:0.2; }
  }

  @media (prefers-reduced-motion: reduce){
    #preloader{ transition:none; }
    .loader-label .sq{ animation:none; }
    .block-row .block{ transition:none; }
  }

  main{
    position:relative;
    z-index:5;
    min-height:calc(100vh - 60px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:56px;
    padding:40px 8vw;
    flex-wrap:wrap;
  }

  @keyframes fadeInLeft{
    from{ opacity:0; transform:translateX(-40px); }
    to{ opacity:1; transform:translateX(0); }
  }

  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .portrait{
    position:relative;
    width:220px;
    height:280px;
    flex:0 0 auto;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 15% 100%);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    opacity:0;
    border:var(--secondary) 5px solid;
    border-radius:4px;
  }

  body.loaded .portrait{
    animation:fadeInLeft .8s ease-out forwards;
    animation-delay:0.1s;
  }
  .portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    mix-blend-mode:luminosity;
    opacity:0.95;
  }
  .portrait::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.35), transparent 55%);
  }

  .title-block{
    flex:1 1 420px;
    max-width:560px;
    opacity:0;
  }

  body.loaded .title-block{
    animation:fadeInUp .8s ease-out forwards;
    animation-delay:0.5s;
  }

  .title-row{
    display:flex;
    align-items:baseline;
    gap:18px;
    flex-wrap:wrap;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(3.2rem, 8vw, 6.4rem);
    letter-spacing:0.02em;
    line-height:0.9;
    color:var(--secondary);
  }

  .year{
    font-family:'JetBrains Mono', monospace;
    font-size:1.15rem;
    color:var(--secondary);
    letter-spacing:0.05em;
  }

  .subtitle{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 46px;
    font-family:'Sora', monospace;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--secondary);
  }
  .subtitle .sq{
    width:8px; height:8px;
    background:var(--secondary);
  }

  .menu{
    display:flex;
    flex-direction:column;
    gap:4px;
    opacity:0;
  }

  body.loaded .menu{
    animation:fadeInUp .8s ease-out forwards;
    animation-delay:0.9s;
  }

  .menu-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 4px;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    letter-spacing:0.12em;
    color:var(--secondary);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    max-width:340px;
    transition:color .2s ease, padding-left .2s ease;
  }

  .menu-item .marker{
    width:0px;
    height:2px;
    background:var(--secondary);
    transition:width .2s ease;
  }

  .menu-item:hover,
  .menu-item:focus-visible{
    color:var(--text);
    padding-left:14px;
  }
  .menu-item:hover .marker,
  .menu-item:focus-visible .marker{
    width:22px;
  }

  .menu-item.primary{ color:var(--text); }
  .menu-item.primary .marker{ width:22px; background:var(--secondary); }
  .menu-item.primary:hover{ color:var(--secondary); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .portrait,
    .title-block,
    .menu,
    body.loaded .portrait,
    body.loaded .title-block,
    body.loaded .menu{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }

  @media (max-width:720px){
    main{ flex-direction:column; text-align:center; gap:34px; }
    .title-row{ justify-content:center; }
    .subtitle{ justify-content:center; }
    .menu-item{ margin:0 auto; }
  }
</style>
</head>
<body>

  <div id="preloader">
    <div class="hud-frame">
      <div class="hud-corner tl"></div>
      <div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div>
      <div class="hud-corner br"></div>
      <div class="block-row" id="block-row"></div>
    </div>

    <div class="loader-readout">
      <span class="bracket">[</span><span id="loader-number">000</span><span class="bracket">]</span>
    </div>

    <div class="loader-label">
      <span class="sq"></span>
      LOADING
    </div>
  </div>

  <main>
    <div class="portrait">
      <img src="assets/img/perfil-home.jpg" alt="Foto de Caleb Lira">
    </div>

    <div class="title-block">
      <div class="title-row">
        <h1>Portfólio</h1>
        <span class="year">2026</span>
      </div>
      <div class="subtitle">
        <span class="sq"></span>
        FRONT-END DEVELOPER
      </div>

      <nav class="menu">
        <a class="menu-item primary" href="portfolio.html">
          <span class="marker"></span> VIEW PORTFÓLIO
        </a>
      </nav>
    </div>
  </main>

  <script>
    (function () {
      const preloader   = document.getElementById('preloader');
      const blockRow     = document.getElementById('block-row');
      const numberEl     = document.getElementById('loader-number');

      const DURATION     = 2600;  // 
      const TOTAL_BLOCKS  = 24;   

      const blocks = [];
      for (let i = 0; i < TOTAL_BLOCKS; i++) {
        const b = document.createElement('div');
        b.className = 'block';
        blockRow.appendChild(b);
        blocks.push(b);
      }

      let start = null;
      let lastActiveCount = 0;

      function step(timestamp) {
        if (!start) start = timestamp;
        const elapsed = timestamp - start;

        const progress = Math.min(elapsed / DURATION, 1);
        const eased = 1 - Math.pow(1 - progress, 2);
        const percent = Math.round(eased * 100);

        numberEl.textContent = String(percent).padStart(3, '0');

        const activeCount = Math.round((percent / 100) * TOTAL_BLOCKS);
        if (activeCount !== lastActiveCount) {
          for (let i = 0; i < TOTAL_BLOCKS; i++) {
            blocks[i].classList.toggle('active', i < activeCount);
          }
          lastActiveCount = activeCount;
        }

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          finish();
        }
      }

      function finish() {
        setTimeout(() => {
          preloader.classList.add('hide');
          document.body.classList.add('loaded');
        }, 300);
      }

      window.addEventListener('load', () => {
        requestAnimationFrame(step);
      });

      setTimeout(() => {
        if (!preloader.classList.contains('hide')) {
          finish();
        }
      }, DURATION + 5000);
    })();
  </script>

</body>
</html>
