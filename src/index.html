<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEU NOME — Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#05070B;
    --bg-2:#0C1220;
    --crimson:#AE1230;
    --crimson-light:#E8385A;
    --text:#EDEDF2;
    --muted:#6E7688;
    --line:rgba(237,237,242,0.08);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    background:
      radial-gradient(1100px 700px at 78% 20%, rgba(174,18,48,0.16), transparent 60%),
      radial-gradient(900px 600px at 15% 85%, rgba(23,40,70,0.35), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 70%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* textura de scanline sutil, clima de HUD */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:1;
  }

  /* --- HUD: cantos e topo --- */
  .hud-corner{
    position:fixed;
    width:26px; height:26px;
    border-color:rgba(237,237,242,0.25);
    z-index:5;
  }
  .hud-tl{ top:24px; left:24px; border-top:1.5px solid; border-left:1.5px solid; }
  .hud-tr{ top:24px; right:24px; border-top:1.5px solid; border-right:1.5px solid; }
  .hud-bl{ bottom:24px; left:24px; border-bottom:1.5px solid; border-left:1.5px solid; }
  .hud-br{ bottom:24px; right:24px; border-bottom:1.5px solid; border-right:1.5px solid; }

  .brand{
    position:relative;
    z-index:5;
    display:flex;
    align-items:center;
    gap:10px;
    padding:34px 0 0 60px;
  }
  .brand-mark{
    width:20px; height:20px;
    border:1.5px solid var(--crimson-light);
    transform:rotate(45deg);
  }
  .brand-text{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--muted);
  }

  /* --- layout principal --- */
  main{
    position:relative;
    z-index:5;
    min-height:calc(100vh - 60px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:56px;
    padding:40px 8vw;
    flex-wrap:wrap;
  }

  /* painel retrato abstrato */
  .portrait{
    position:relative;
    width:220px;
    height:280px;
    flex:0 0 auto;
    background:linear-gradient(200deg, var(--crimson-light), var(--crimson) 55%, #4a0716 100%);
    clip-path:polygon(0 0, 100% 0, 100% 100%, 15% 100%);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
  }
  .portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    /* deixa a foto em duotone vermelho, combinando com o painel */
    filter:grayscale(1) contrast(1.15);
    mix-blend-mode:luminosity;
    opacity:0.95;
  }
  .portrait::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.35), transparent 55%);
  }

  .title-block{
    flex:1 1 420px;
    max-width:560px;
  }

  .title-row{
    display:flex;
    align-items:baseline;
    gap:18px;
    flex-wrap:wrap;
  }

  h1{
    font-family:'Bebas Neue', sans-serif;
    font-weight:400;
    font-size:clamp(3.2rem, 8vw, 6.4rem);
    letter-spacing:0.02em;
    line-height:0.9;
    color:var(--text);
  }

  .year{
    font-family:'JetBrains Mono', monospace;
    font-size:1.15rem;
    color:var(--crimson-light);
    letter-spacing:0.05em;
  }

  .subtitle{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 46px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--muted);
  }
  .subtitle .sq{
    width:8px; height:8px;
    background:var(--crimson-light);
  }

  /* --- menu estilo jogo --- */
  .menu{
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .menu-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 4px;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    letter-spacing:0.12em;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    max-width:340px;
    transition:color .2s ease, padding-left .2s ease;
  }

  .menu-item .marker{
    width:0px;
    height:2px;
    background:var(--crimson-light);
    transition:width .2s ease;
  }

  .menu-item:hover,
  .menu-item:focus-visible{
    color:var(--text);
    padding-left:14px;
  }
  .menu-item:hover .marker,
  .menu-item:focus-visible .marker{
    width:22px;
  }

  .menu-item.primary{ color:var(--text); }
  .menu-item.primary .marker{ width:22px; background:var(--crimson-light); }
  .menu-item.primary:hover{ color:var(--crimson-light); }

  footer{
    position:relative;
    z-index:5;
    text-align:center;
    padding:0 0 34px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  @media (max-width:720px){
    main{ flex-direction:column; text-align:center; gap:34px; }
    .title-row{ justify-content:center; }
    .subtitle{ justify-content:center; }
    .menu-item{ margin:0 auto; }
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">Caleb Lira</div>
  </div>

  <main>
    <div class="portrait">
      <img src="sua-foto.jpg" alt="Foto de Caleb Lira">
    </div>

    <div class="title-block">
      <div class="title-row">
        <h1>PORTFÓLIO</h1>
        <span class="year">2026</span>
      </div>
      <div class="subtitle">
        <span class="sq"></span>
        DESENVOLVEDOR(A)
      </div>

      <nav class="menu">
        <a class="menu-item primary" href="portfolio.html">
          <span class="marker"></span> VER PORTFÓLIO
        </a>
      </nav>
    </div>
  </main>


</body>
</html>
